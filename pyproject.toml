# tesseraline-airlock/pyproject.toml.

[project]
name = "tesseraline-airlock"
version = "0.1.0"
description = "A gateway for LLM agent tools: every call checked by policy, secrets kept from the agent, egress allowlisted."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "Tesseraline" }]
# The gateway runs on the standard library plus tesseraline-invariants, which itself needs nothing else.
dependencies = ["tesseraline-invariants>=0.0.4,<0.1"]

[project.scripts]
airlock = "tesseraline_airlock.cli:main"

[dependency-groups]
dev = [
    "tesseraline-invariants[check]>=0.0.4,<0.1",   # `invariants check` for the gateway's own promises
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tesseraline_airlock"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM", "RUF", "ANN", "S", "PL", "TRY", "PT", "PTH", "RET", "ARG",
          "TC", "TID", "ERA", "PERF", "FURB", "LOG", "DTZ", "N", "D", "T"]
ignore = ["PLR0913", "PLR0917", "D100", "D104", "D203", "D213", "TRY003", "D107", "D105",
          "TC"]   # TC: tesseraline-invariants reads annotations (Secret) at run time

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PT018", "E501", "E731", "S101", "S603", "S607", "ANN", "D", "PLR2004", "ARG", "TC", "S105", "S106", "PLC0415"]
"src/tesseraline_airlock/cli.py" = ["T201", "PLC0415"]   # imports load only for the command that needs them
"examples/**/*.py" = ["D", "ANN", "T201", "S", "TC"]

[tool.ruff.format]
exclude = ["docs/*.md"]
docstring-code-format = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-p", "no:invariants", "-ra", "--strict-markers", "--strict-config", "--tb=short"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.invariants]
modules = ["tesseraline_airlock.records"]   # imported to collect the promises
